[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "actas"
version = "0.14.1"
description = "Delegation tokens for AI agents - a runnable OAuth 2.0 Token Exchange (RFC 8693) reference"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "PyJWT[crypto]>=2.3",
  "cryptography>=42",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "hypothesis>=6.0",
]

[project.scripts]
actas-register-client = "actas.register_client:main"
actas-rotate-key = "actas.rotate_key:main"

[tool.setuptools]
packages = ["actas"]
